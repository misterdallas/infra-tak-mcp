[metadata]
name = infra-tak-mcp
version = 0.1.1

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    mcp[cli]>=1.9.0
    httpx>=0.27.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    infra-tak-mcp = infra_tak_mcp.server:main
