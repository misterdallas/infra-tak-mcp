[project]
name = "infra-tak-mcp"
version = "0.1.0"
description = "MCP server for infra-TAK marketplace, Node-RED, MediaMTX, TAK video, and Docker."
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.9.0",
  "httpx>=0.27.0",
]

[project.scripts]
infra-tak-mcp = "infra_tak_mcp.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
